# Debian 13 (trixie) preseed for the Jenkins agent golden image.
#
# Deliberately minimal. Everything that makes this an *agent* image (Temurin 21, guest tools,
# cloud-init reset) lives in image/provision.sh, which runs afterwards as Packer's shell
# provisioner and which CI executes on every push. Keep this file about the installer only.
#
# UNVERIFIED against XCP-ng's VNC console. See the header of xcpng-jenkins-agent.pkr.hcl.

d-i debian-installer/locale string en_US
d-i keyboard-configuration/xkb-keymap select us

d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string jenkins-agent
d-i netcfg/get_domain string unassigned-domain

d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Everything comes from the network mirror above, so do not let apt-setup treat the netinst ISO as a
# package source. Without these the installer scans the media, fails, and raises a blocking
# "apt configuration problem / An attempt to configure apt to install additional packages from the
# media failed" dialog. That stops an otherwise unattended build dead, and because Packer only ever
# logs "Wait for VM's IP to become known to us" it looks like a slow install rather than a prompt
# waiting for an answer. Observed on the console at the point the build hung.
#
# The three set-* answers keep apt-setup from getting as far as asking, and disable-cdrom-entries
# keeps a cdrom line out of the installed sources.list, which would otherwise break apt on every
# clone the moment the ISO is detached.
#
# NONE OF THOSE STOPS THE DIALOG THAT ACTUALLY BLOCKS, and an earlier version of this comment
# claimed set-failed did. It does not. THE BUILD IS STILL NOT UNATTENDED; see issue #110.
#
# What blocks is `apt-setup/cdrom/failed`, Type: error, Description "apt configuration problem".
# What this file answers is `apt-setup/cdrom/set-failed`, Type: boolean, Description "Scan extra
# installation media?". One word apart in the name, near-identical body text, which is why
# answering the wrong one read as a fix once the next build happened to go green.
#
# Root cause, off the installed system's /var/log/installer/syslog rather than reasoned:
# apt-cdrom adds the netinst correctly, writes its source list entry, then says "Repeat this
# process for the rest of the CDs in your set" and walks onto the second optical device. That is
# the XCP-ng Tools ISO, attached by the builder via tools_iso_name, and it is not a Debian disc:
#
#   E: Unable to locate any package files, perhaps this is not a Debian Disc or the wrong
#      architecture?
#   warning: /usr/lib/apt-setup/generators/40cdrom returned error code 1
#
# 40cdrom then calls bail_out, which raises the error with `db_input critical`.
#
# SEEDING THIS TEMPLATE DOES NOT WORK. Do not add a line for it here; two full builds have already
# been spent proving it. `d-i apt-setup/cdrom/failed note` was tried first, on the theory that a
# note is dismissed the way finish-install/reboot_in_progress is. It changed nothing. Then
# `d-i apt-setup/cdrom/failed error`, the type apt-cdrom-setup actually registers, on the theory
# that a type mismatch was letting the udeb replace the template and clear its seen flag. That
# changed nothing either: same dialog, same point in the install.
#
# So the fix has to stop apt-cdrom failing rather than hide the error it raises, which means not
# presenting a second non-Debian disc to apt-setup at all: dropping tools_iso_name and delivering
# the guest-tools deb another way. That is a design change, and it pulls against the deadlock fix
# that needs the ISO present, so it is #110 rather than a quick edit.
#
# Until then a build stops here and waits for a human, and Packer renders that as the same silent
# "Wait for VM's IP". One Return on the console (tools/vnc_console.py --key 0xff0d) releases it and
# the rest of the install completes unattended.
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false
d-i apt-setup/disable-cdrom-entries boolean true

d-i passwd/root-login boolean false
d-i passwd/user-fullname string Debian
d-i passwd/username string debian
d-i passwd/user-password password debian
d-i passwd/user-password-again password debian
d-i user-setup/allow-password-weak boolean true

d-i clock-setup/utc boolean true
d-i time/zone string UTC
d-i clock-setup/ntp boolean true

d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

tasksel tasksel/first multiselect standard, ssh-server
# cloud-init stays in the image on purpose. Plugin clones boot with no NoCloud datasource
# (DataSourceNone) and are seeded over xenstore, so provision.sh adds growroot and ssh-host-key
# oneshots to cover what cloud-init would otherwise do at first boot. It is kept for the from-scratch
# import_raw_vdi bootstrap, whose disk has no persisted network config and needs a seed
# network-config to come up at all; installing it here also keeps provision.sh focused on the agent
# runtime.
#
# On the clone path it does NOT bring the network up, and the earlier note here saying that was
# unconfirmed was also wrong about which way the risk ran. cloud-init renders
# /etc/netplan/50-cloud-init.yaml at build time and that file persists through templating: `cloud-init
# clean` leaves it in place, so a clone has a network config without needing a datasource. The real
# hazard is its content. The rendered stanza pins `match: macaddress:` to the builder's NIC, and
# VM.clone regenerates an autogenerated MAC, so on a clone it matches nothing and the interface never
# comes up: a genuinely silent no-network boot, just not by the route feared here. provision.sh
# rewrites the file to match on interface name and fails the build if a MAC-pinned stanza survives.
d-i pkgsel/include string sudo curl ca-certificates cloud-init
d-i pkgsel/upgrade select full-upgrade
popularity-contest popularity-contest/participate boolean false

d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Packer connects over SSH as 'debian' and runs provision.sh via passwordless sudo (see the
# template's execute_command). This drop-in is what makes that sudo passwordless; provision.sh
# removes it again during template cleanup so it does not survive into clones.
# The guest agent must be present at first boot, before Packer connects. Packer's xenserver builder
# learns the VM's address from XAPI, XAPI only learns it from xe-guest-utilities, and until then the
# build sits on "Wait for VM's IP to become known to us" while the VM is up, on the LAN and happily
# answering SSH. That is a deadlock, not slowness: provision.sh installs the guest tools, but it runs
# over the SSH connection this step is waiting to be able to make.
#
# The package is not in the Debian archive, so it cannot come from pkgsel/include. It is on the
# XCP-ng Tools ISO, which the builder has already attached as a second optical device: under Packer
# the netinst is /dev/sr0 and the tools ISO is /dev/sr1, so search rather than hardcode either. On a
# hand-built VM with only the tools ISO attached this finds sr0 instead, and the loop covers both.
#
# Failure here is deliberately not fatal. A hand-built image can legitimately have no tools ISO
# attached at install time, and provision.sh installs the agent later anyway; only the Packer path
# needs it this early. A preseed has no way to tell which caller it is running for, so it cannot be
# fatal for one and optional for the other: d-i exposes no "am I being driven by Packer" signal.
# What it can do is leave evidence. Every step appends to /var/log/xcpng-guest-tools.log in the
# installed system, so a build that hangs on "Wait for VM's IP" can be diagnosed from the console
# (tools/vnc_console.py) or from the disk, instead of presenting as an unexplained stall.
#
# apt-get, not dpkg -i: the deb may pull dependencies and dpkg does not resolve them, which would
# leave the package unconfigured and re-open the very deadlock this block exists to close. apt-get
# takes an absolute path to a local .deb and resolves its dependencies from the archive, which the
# netinstall has just configured — measured on Debian 13.6, apt 3.0.3, where the file resolves as
# "local-deb" and a missing dependency is pulled from the archive. Same call as provision.sh.
#
# The deb is selected with a glob and `set --`, not `ls | head -1`: an ISO shipping two versions
# should be an error naming both, not an arbitrary pick that silently installs the wrong one.
d-i preseed/late_command string \
  in-target sh -c 'echo "debian ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/debian'; \
  in-target chmod 0440 /etc/sudoers.d/debian; \
  sh -c 'log() { echo "$@" >> /target/var/log/xcpng-guest-tools.log; }; \
  log "searching /dev/sr* for the XCP-ng guest tools deb"; \
  for d in /dev/sr*; do \
      [ -b "$d" ] || continue; \
      mkdir -p /media/gt; \
      mount -t iso9660 -o ro "$d" /media/gt 2>/dev/null || { log "$d: not mountable as iso9660"; continue; }; \
      set -- /media/gt/Linux/xe-guest-utilities_*_amd64.deb; \
      if [ ! -e "$1" ]; then log "$d: no xe-guest-utilities deb"; umount /media/gt; continue; fi; \
      if [ "$#" -gt 1 ]; then log "$d: FAILED, multiple xe-guest-utilities debs: $*"; umount /media/gt; break; fi; \
      log "$d: found $1"; \
      cp "$1" /target/tmp/xe-guest-utilities.deb; \
      umount /media/gt; \
      if in-target apt-get install -y -q /tmp/xe-guest-utilities.deb >> /target/var/log/xcpng-guest-tools.log 2>&1; then \
          log "installed; enabling xe-linux-distribution"; \
          in-target systemctl enable xe-linux-distribution >> /target/var/log/xcpng-guest-tools.log 2>&1 \
              || log "FAILED to enable xe-linux-distribution"; \
      else \
          log "FAILED to install the guest tools: XAPI will not report an IP, so a Packer build will hang waiting for one"; \
      fi; \
      in-target rm -f /tmp/xe-guest-utilities.deb; \
      break; \
  done' || true

d-i finish-install/reboot_in_progress note
