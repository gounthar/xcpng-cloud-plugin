# Bumps versions dependabot cannot see.
#
# Dependabot reads pom.xml and the `uses:` lines in these workflows, and it owns those. It cannot
# read a version inside a `run:` step that curls a zip, nor one inside Packer HCL. Those two live
# in updatecli/updatecli.d/packer.yaml.
#
# Layout and wiring copied from jenkins-infra/jenkins.io and jenkins-docs/quickstart-tutorials,
# which is where this pattern is actually maintained.
#
# It runs on UPDATECLI_TOKEN rather than on the built-in GITHUB_TOKEN, and that is not a
# preference. One of the two versions this bumps, PACKER_VERSION, lives in ci.yml, and GITHUB_TOKEN
# is a GitHub App installation token, which GitHub's push receive-hook refuses for any file under
# .github/workflows/:
#
#     refusing to allow a GitHub App to create or update workflow
#     `.github/workflows/ci.yml` without `workflows` permission
#
# There is no way to grant that in a workflow. The `permissions:` key has no `workflows` scope, and
# `contents: write` does not cover workflow files — the job that produced the error above held
# `contents: write` at the time. `workflow` is a classic personal access token scope, documented as
# granting "the ability to add and update GitHub Actions workflow files", so the token has to come
# from outside the run. Requirements and the fork behaviour are in README.md under
# "Dependency updates".
#
# A side effect worth knowing: pushes made with GITHUB_TOKEN do not trigger other workflows, so
# until now an updatecli pull request would have arrived with no CI on it. One made with a personal
# access token does trigger them.
---
name: updatecli

on:
  workflow_dispatch:
  schedule:
    # Once a week. A spike does not need daily dependency churn.
    - cron: '0 2 * * 1'

# Deliberately not on pull_request. The targets carry `scmid: default`, so updatecli resolves their
# file paths against the remote default branch, not the pull request's checkout. A pull request that
# introduces or moves a target therefore always fails the diff, because the file it points at does
# not exist on main yet. That is a check nobody can turn green, which is worse than no check.
# Run it on a schedule, and by hand after a target moves.

permissions:
  contents: read

jobs:
  updatecli:
    runs-on: ubuntu-latest
    # Never run against a fork: it would try to open pull requests on the upstream repository.
    # Check fork status, not the owner name: a hardcoded owner would skip the whole job the day
    # this transfers to the jenkinsci org, the same brittleness the values file was changed to
    # avoid. If an event ever lacks a repository object, `null == false` is false and the job
    # skips, which is the safe direction.
    if: github.event.repository.fork == false
    # No job-level block, so this inherits `contents: read` from the top of the file. Every write
    # updatecli performs goes through UPDATECLI_TOKEN, so GITHUB_TOKEN needs nothing beyond reading
    # the checkout. Raising it back to `contents: write` would not help the workflow-file push and
    # would only widen what a compromised step could reach.
    steps:
      - uses: actions/checkout@v7

      # Fail here, loudly, rather than several minutes later inside an opaque git authentication
      # error. An empty secret is the likeliest state of this workflow: it is the one part of the
      # setup that cannot live in the repository.
      - name: The updatecli token must be set
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_TOKEN }}
        run: |
          test -n "$UPDATECLI_GITHUB_TOKEN" || {
            echo "::error::UPDATECLI_TOKEN is not set. See README.md, Dependency updates."
            exit 1
          }

      # Pinned. Dependabot's github-actions ecosystem keeps this one current.
      - name: Install Updatecli
        uses: updatecli/updatecli-action@v3.4.0

      - name: Diff
        run: |
          updatecli pipeline diff \
            --config ./updatecli/updatecli.d \
            --values ./updatecli/values.github-action.yaml \
            --values-inline '{"github":{"owner":"${{ github.repository_owner }}"}}'
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_TOKEN }}

      - name: Apply
        if: github.ref == 'refs/heads/main'
        run: |
          updatecli pipeline apply \
            --config ./updatecli/updatecli.d \
            --values ./updatecli/values.github-action.yaml \
            --values-inline '{"github":{"owner":"${{ github.repository_owner }}"}}'
        env:
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.UPDATECLI_TOKEN }}
