---
# Tell a contributor, once, when their pull request comes from their fork's default branch.
#
# It is deliberately advisory. Nothing here fails, nothing here blocks a merge, and the pull request
# is still perfectly reviewable: #182 arrived this way and was merged. What it costs the contributor
# is their own default branch for the length of the review: they cannot start anything else from a
# clean base without disturbing the pull request, and a maintainer pushing a fixup writes to it.
# That is worth one comment and is not worth a red X on somebody's first contribution.
#
# `pull_request_target` rather than `pull_request` because the token on a fork's `pull_request` run
# is read-only, so the comment would silently never post. This job checks out nothing and runs no
# code from the pull request, which is what makes that trigger safe here. Keep it that way: never
# add `actions/checkout`.
#
# Every value read from the pull request is read in JavaScript, from `context.payload`, and never
# interpolated into a shell command through `${{ }}`. A branch name is attacker-controlled text.

name: pull request from a fork's default branch

on:
  pull_request_target:
    types: [opened]

# Both, matching actions/first-interaction and the first-merge greeting: the comment goes through
# /issues/{n}/comments even for a pull request, and too few permissions fails it silently.
permissions:
  issues: write
  pull-requests: write

jobs:
  advise:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    steps:
      - name: Comment when the head branch is the fork's default branch
        uses: actions/github-script@v7
        with:
          script: |
            const head = context.payload.pull_request.head;
            const branch = head.ref;
            const defaultBranch = head.repo.default_branch;

            // A ref name is attacker-controlled and git permits more than it looks. check-ref-format
            // rules out space, ~ ^ : ? * [ \ and control characters, and says nothing about backticks,
            // brackets or @ signs. So a fork can legitimately push a branch whose name closes the inline
            // code span below and continues in Markdown, in a comment this repository's own token posts:
            // an @mention that notifies people, or a [link](...) pointing anywhere.
            //
            // Whitelist rather than strip, because the blacklist is the thing that turned out to be
            // incomplete. Everything outside a normal ref alphabet becomes a question mark, which keeps
            // ordinary names untouched and makes a hostile one visibly odd instead of active.
            const md = (s) => String(s).replace(/[^\w./-]/g, '?');
            const safeBranch = md(branch);

            if (branch !== defaultBranch) {
              // Raw here on purpose: a workflow log is plain text, so there is nothing to inject into,
              // and the unaltered name is what a maintainer would want to see when reading the run.
              core.info(`Head branch ${branch} is not the fork's default (${defaultBranch}); nothing to say.`);
              return;
            }

            const suggested = 'fix/short-description';
            const contributing =
              `${context.payload.repository.html_url}/blob/main/CONTRIBUTING.md#branches-commits-and-pull-requests`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: [
                `This one comes from \`${safeBranch}\`, which is your fork's default branch. It is fine to`,
                'review and it will merge as it is. This is a note for next time, not something to fix.',
                '',
                'The cost is yours rather than ours: while this is open, that branch is pinned to this',
                'change, so starting anything else from a clean base means disturbing this pull request,',
                `and a maintainer pushing a fixup writes to your \`${safeBranch}\`.`,
                '',
                'Moving it onto a branch is two commands, and the pull request follows the push:',
                '',
                '```console',
                `$ git switch -c ${suggested}`,
                `$ git push -u origin ${suggested}`,
                '```',
                '',
                'Then change the head branch on this pull request with the *Edit* button beside its title.',
                '',
                `Tidying \`${safeBranch}\` on your fork afterwards is optional and separate: your \`origin\` is`,
                'your fork, so it already has these commits, and putting it back needs a remote pointing at',
                'this repository and a force push over your own branch. Worth doing deliberately, not as',
                'part of moving a pull request.',
                '',
                `[\`CONTRIBUTING.md\`](${contributing}) has the branch naming we use.`,
                'Thanks for the contribution.',
              ].join('\n'),
            });
