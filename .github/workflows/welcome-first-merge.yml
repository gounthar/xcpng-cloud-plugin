---
# Thank a contributor the first time one of their pull requests is merged here.
#
# The trigger is the merge, not the open. A greeting on `opened` costs a newcomer a notification
# before anyone has looked at their work, and says nothing they did not already know. A note on the
# merge lands when there is something to thank them for, and it is the moment they are most likely
# to come back.
#
# `pull_request_target` rather than `pull_request` because the token on a fork's `pull_request` run
# is read-only, so the comment would silently never post. The usual danger of `pull_request_target`
# is that it runs with a writable token in the base repo's context while checking out the fork's
# code; this job checks out nothing and runs no code from the pull request, so that danger is not
# present. Keep it that way: never add `actions/checkout` here.

name: welcome first merge

on:
  pull_request_target:
    types: [closed]

# Both, following actions/first-interaction, which declares the same pair for the same job. The
# endpoint is /issues/{n}/comments even when the subject is a pull request, and the docs do not say
# plainly which of the two covers that case. Getting it wrong fails the comment silently, on a
# first-time contributor's merge, which is the one moment this exists for.
permissions:
  issues: write
  pull-requests: write

jobs:
  thank:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Comment when this is the author's first merged pull request
        uses: actions/github-script@v7
        with:
          script: |
            const author = context.payload.pull_request.user.login;
            const number = context.payload.pull_request.number;

            if (context.payload.pull_request.user.type === 'Bot') {
              core.info(`${author} is a bot; nothing to say.`);
              return;
            }

            // Read the repository's own list of closed pull requests, NOT the search API.
            //
            // Search was the first attempt and it is wrong here. Its index lags a merge by seconds to
            // minutes, and discarding the triggering pull request only covers that one record. Two pull
            // requests from the same new author merged inside the lag window would each find nothing
            // indexed, so both runs would post a first-merge greeting and the contributor would be
            // thanked twice for their first contribution. The pulls list is repository state rather than
            // a view over it, so it is correct the instant the merge lands.
            //
            // Paginated with an early exit: a returning contributor is usually found on the first page,
            // and only a genuine first-timer walks the whole list. That is the expensive case and it is
            // the one worth being certain about.
            let earlier = null;
            for await (const page of github.paginate.iterator(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100,
              sort: 'updated',
              direction: 'desc',
            })) {
              earlier = page.data.find(
                (pr) => pr.number !== number && pr.merged_at && pr.user && pr.user.login === author,
              );
              if (earlier) break;
            }
            if (earlier) {
              core.info(`${author} already had #${earlier.number} merged; not a first.`);
              return;
            }

            core.info(`First merged pull request for ${author}; commenting on #${number}.`);
            const repoUrl = context.payload.repository.html_url;
            const goodFirstIssue = `${repoUrl}/labels/good%20first%20issue`;
            const contributing = `${repoUrl}/blob/main/CONTRIBUTING.md`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: [
                `Thanks @${author}, that is your first change merged here, and it is in.`,
                '',
                [
                  `If you want another, the [\`good first issue\`](${goodFirstIssue}) label is where the`,
                  `small, self-contained ones live, and [\`CONTRIBUTING.md\`](${contributing}) has the`,
                  'build and test commands. Asking on an issue before you write any code is',
                  'welcome, and usually saves you a round of review.',
                ].join(' '),
              ].join('\n'),
            });
