# Release Drafter keeps one draft release open, accumulating merged pull requests into
# notes and computing the next version from their labels. Nothing is published until a
# human presses publish; that press creates the tag, which fires `release.yml` to build
# and attach the .hpi.
#
# This mirrors what JEP-229 continuous delivery does inside the jenkinsci org, so if the
# plugin is ever donated the change is swapping in `cd.yaml` rather than rethinking how
# releases are decided. See the Releases section of README.md.
#
# Everything below lives in one `categories` list on purpose. Release Drafter deprecated
# the three separate spellings this file used to carry -- `categories[*].labels`, the
# top-level `exclude-labels`, and `version-resolver.{major,minor,patch}.labels` -- in
# favour of entries in this list distinguished by `type`. The run log named all eight
# before the migration; upstream documents the move in release-drafter/release-drafter#1558.
---
name-template: '$RESOLVED_VERSION'
tag-template: '$RESOLVED_VERSION'

categories:
  - title: Features
    when:
      labels:
        - enhancement
  - title: Bug fixes
    when:
      labels:
        - bug
  - title: Documentation
    when:
      labels:
        - documentation
  # `java` is deliberately absent from this list, and putting it back reintroduces a
  # published defect. Release Drafter files a pull request under *every* category it
  # matches -- the `break` in categorize-pull-requests.ts fires only when a category sets
  # `exclusive` -- and every Java code change here carries `java` plus `bug` or
  # `enhancement`. Nine entries in the 0.3.0 draft therefore rendered twice, under Bug
  # fixes or Features and again here. The other three labels say what kind of change it
  # is; `java` says what it touched, which is true of nearly every pull request. See #177.
  - title: Build, CI, and dependencies
    when:
      labels:
        - build
        - dependencies
        - github_actions

  # The catch-all. A `changelog` category with a title and no `when:` parses to `when: []`
  # (config/parse-categories.ts), which is exactly what categorize-pull-requests.ts looks
  # for when it picks `uncategorizedCategoryIndex`. Without it an unlabelled pull request
  # goes to the uncategorized list, which generate-changelog.ts pushes *before* the loop
  # over categories -- so it renders above every heading with nothing above it, and reads
  # as a truncated changelog. Three entries did that in the 0.3.0 draft. See #177.
  #
  # It cannot move the version. A changelog category's `semver-increment` defaults to
  # patch and contributes only for pull requests that reach it, and the trailing
  # version-resolver below already falls back to patch, so the Math.max in
  # resolve-version-increment.ts is a no-op here.
  - title: Other changes

  - type: 'pre-exclude'
    when:
      label: skip-changelog

  # The version resolves from the `type: version-resolver` entries below, and the last one
  # is the important line: it carries no `when:`, which is how the old `default: patch` is
  # spelled in the new form. It matters more than any individual label entry, because an
  # unlabelled pull request still lands somewhere sensible instead of silently deciding the
  # version for us. Dropping it does not break the parse -- it stops resolving a version at
  # all for an unlabelled pull request, and that surfaces only when a release is cut.
  # Where two entries match, the highest increment wins: `getHighestPriority` in
  # resolve-version-increment.ts takes a Math.max over every matching entry, so a single
  # pull request carrying the right label decides the version for the whole release.
  #
  # `major` and `minor` are deliberately absent from the label lists below, and putting
  # either back reintroduces a defect that reaches the published tag. dependabot labels its
  # own pull requests with the *dependency's* semver bump, unprompted -- nothing here or in
  # any workflow asks it to. #173 (actions/setup-java 5.6.0 to 6.0.0) arrived carrying
  # `major`, which is true of the Action and says nothing about this plugin, and the draft
  # release duly renamed itself 1.0.0. `breaking` covers the case these entries are for, and
  # it is ours alone. A dependabot pull request now falls through to the patch entry via
  # `dependencies` / `github_actions`, which is what a dependency bump should do. See #198.
  - type: 'version-resolver'
    semver-increment: major
    when:
      labels:
        - breaking
  - type: 'version-resolver'
    semver-increment: minor
    when:
      labels:
        - enhancement
  - type: 'version-resolver'
    semver-increment: patch
    when:
      labels:
        - patch
        - bug
        - documentation
        - dependencies
        - build
        - github_actions
        - java
  - type: 'version-resolver'
    semver-increment: patch

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'
no-changes-template: '- No user-visible changes'

template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...$RESOLVED_VERSION

  ## Installing

  This plugin is not in the Jenkins update centre. Download the `.hpi` below and install it
  through *Manage Jenkins → Plugins → Advanced settings → Deploy Plugin*.
