jenkins:
  clouds:
    - xcpng:
        name: "xcpng-lab"
        poolUrl: "https://192.168.1.87"
        credentialsId: "xcpng-root"
        trustSelfSigned: true
        maxInstances: 3
        idleMinutes: 15
        templates:
          - templateName: "jenkins-golden-debian"
            labelString: "xcpng-linux"
            numCpus: 4
            memoryMb: 8192
            minInstances: 1
            sshAuthorizedKey: "ssh-ed25519 AAAAExampleKeyForRoundTripTest lab"
