# Text for the XCP-ng held-leak administrative monitor. A translation adds message_<lang>.properties beside
# this base bundle. "cloud" takes an argument, so it goes through MessageFormat: no apostrophes anywhere here.
intro=The pool read these VMs as halted while their Jenkins agents were still connected, so their teardown was refused: deleting a VM in that state skips the shutdown and can remove the disks of a running domain. Cleanup retries each one every minute and destroys it once the pool reads it running, paused or suspended, the states Xen Orchestra shuts down before deleting. A VM that really did stop keeps reading halted and stays listed here, with its disks, until someone removes it. The command below, run from a checkout of the plugin, is a dry run that reports whether dom0 still runs each VM. Do not add --apply while agents of that cloud are up: it selects every VM of the cloud, not only these. Each entry clears on the next sweep once its VM is gone.
cloud=Cloud {0}:
