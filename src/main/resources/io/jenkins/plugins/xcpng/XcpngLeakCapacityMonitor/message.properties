# Text for the XCP-ng leak-capacity administrative monitor. A translation adds message_<lang>.properties beside
# this base bundle. No apostrophes anywhere here: Jelly passes these through MessageFormat.
intro=These clouds have VMs whose teardown failed and that are still on the pool. A VM cleanup is still retrying counts against the cloud Max instances until it is destroyed, so a cloud whose slots are all held this way provisions nothing. A VM cleanup will not delete on its own, because it lacks the cloud owner tags or the pool reads it halted while its agent was connected, does not count, but stays on the pool with its disks until someone removes it. Check the Jenkins log for the reason each destroy failed.
