# Text for the XCP-ng leak-capacity administrative monitor. A translation adds message_<lang>.properties beside
# this base bundle. No apostrophes anywhere here: Jelly passes these through MessageFormat.
intro=These clouds have VMs whose teardown failed. Each one still uses the pool, so it counts against the cloud Max instances until cleanup destroys it, and a cloud whose slots are all held this way provisions nothing. Cleanup retries every minute; a VM it may not touch, such as one without the cloud owner tags, stays counted until someone removes it from the pool. Check the Jenkins log for the reason each destroy failed.
