XcpngCloud.testConnection.pool=Templates are resolved in pool {0}.
XcpngCloud.testConnection.pools=This token sees {0} pools: {1}. Templates are resolved in all of them, so an image name carried by two of them is ambiguous; set Pool to the uuid of the one this cloud should provision into.

