XcpngCloud.poolUrl.schemeMissing=The Xen Orchestra URL must start with https://.
XcpngCloud.poolUrl.http=The Xen Orchestra URL must use https://; http would send the authentication token in cleartext.
XcpngCloud.poolUrl.noHost=The Xen Orchestra URL must include a host, for example https://xo.example.com.
