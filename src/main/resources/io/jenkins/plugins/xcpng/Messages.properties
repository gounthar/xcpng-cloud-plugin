# Human-facing strings resolved through the generated Messages class: descriptor display names and the
# doCheck / doTestConnection form-validation messages. A translation adds Messages_<lang>.properties beside
# this base bundle. The ${%...} keys in each descriptor's config.jelly are backed separately by a
# config.properties next to that jelly file (Stapler resolves a view's keys against its own directory).
# Every value goes through MessageFormat, placeholder or not: the generated accessor calls
# holder.format(key) even with no arguments. So a literal apostrophe is ALWAYS doubled (''), including
# in values with no {n} in them. A single apostrophe is silently swallowed -- 'controller''s' renders
# as "controller's", 'controller's' renders as "controllers". Measured, not assumed: this comment
# previously claimed the opposite and the first placeholderless apostrophe in the file hit the bug.
