XcpngCloud.credentials.required=Select the Xen Orchestra token credential.
XcpngCloud.credentials.notSecretText=Xen Orchestra authenticates with a secret-text token, and no such credential resolves under this ID. Select a secret-text credential holding an authentication token.
XcpngCloud.backend.removed=The XAPI backend has been removed from this plugin, and {0} is still configured for it, so nothing can be provisioned or destroyed through it. Reconfigure it against a Xen Orchestra appliance: set its URL to the appliance, select a secret-text credential holding a Xen Orchestra token, pin the appliance''s certificate if it is self-signed, and save. VMs it already created carry the xcpng-cloud owner marker, and tools/reaper.py finds them.
XcpngCloud.testConnection.failedNoDetail=Connection failed; see the system log for details.
XcpngCloud.testConnection.failed=Connection failed: {0}
XcpngCloud.testConnection.ok=Connected to Xen Orchestra; its certificate is trusted by this controller''s JVM, so no fingerprint is needed.
XcpngCloud.testConnection.okPinned=Connected to Xen Orchestra; it presented the pinned certificate.
XcpngCloud.testConnection.okAnchored=Connected to Xen Orchestra; its certificate chains to the configured CA certificate and names this host.
XcpngCloud.testConnection.caRefused=The appliance''s certificate was refused against the configured CA certificate: {0}. It is accepted only if it was issued by that CA, directly or through an intermediate the appliance serves, and names the host in the Xen Orchestra URL, as an IP subjectAltName when the URL uses an address; nothing was sent to it.
XcpngCloud.caCertificates.bothSet=Set either Certificate fingerprint or CA certificate, not both. The fingerprint trusts one certificate exactly; the CA certificate trusts what that authority issues. A cloud with both refuses to connect.
XcpngCloud.caCertificates.expired=The CA certificate {0} expired on {1}. It may still verify, since an authority''s own dates are not checked, but the certificates it issued are likely to have expired too.
XcpngCloud.testConnection.untrusted=The appliance''s certificate is not trusted by this controller, which is normal for a Xen Orchestra appliance still on the certificate it generated for itself. It presented SHA-256 {0}. If that is your appliance''s certificate, paste it into Certificate fingerprint and test again; nothing was sent to it. If your organisation''s own CA issued it, paste that CA''s certificate into CA certificate instead.
XcpngCloud.testConnection.probeFailed=Could not read the certificate the appliance presents: {0}
XcpngCloud.certificateFingerprint.malformed={0}
