# Human-facing strings resolved through the generated Messages class: descriptor display names and the
# doCheck / doTestConnection form-validation messages. A translation adds Messages_<lang>.properties beside
# this base bundle. The ${%...} keys in each descriptor's config.jelly are backed separately by a
# config.properties next to that jelly file (Stapler resolves a view's keys against its own directory).
# Keys whose value contains a {n} placeholder are formatted with MessageFormat, so a literal apostrophe in
# those values is doubled ('') and stays single ('') in placeholderless values.
XcpngCloud.DisplayName=XCP-ng
XcpngTemplate.DisplayName=XCP-ng agent template
XcpngAgent.DisplayName=XCP-ng agent

XcpngCloud.poolUrl.malformed=Enter a valid URL, for example https://192.168.1.87.
XcpngCloud.poolUrl.schemeMissing=The pool URL must start with https://.
XcpngCloud.poolUrl.http=The pool URL must use https://; http would send the XAPI credential in cleartext.
XcpngCloud.poolUrl.noHost=The pool URL must include a host, for example https://192.168.1.87.
XcpngCloud.poolUrl.userInfo=Do not put credentials in the pool URL; select them in the Credentials field.
XcpngCloud.poolUrl.required=The pool URL is required.
XcpngCloud.credentials.required=Select the XAPI credentials.
XcpngCloud.testConnection.failedNoDetail=Connection failed; see the system log for details.
XcpngCloud.testConnection.failed=Connection failed: {0}
XcpngCloud.testConnection.okInsecure=Connected to the pool, but TLS verification was disabled because "Trust self-signed certificate" is on.
XcpngCloud.testConnection.ok=Connected to the pool.

XcpngTemplate.templateName.required=The golden-image template name is required.
XcpngTemplate.labelString.required=At least one label is required. Agents from this template only run builds whose label expression matches, so a template with no labels would never be used.
XcpngTemplate.minInstances.notWhole=Warm pool size must be a whole number.
XcpngTemplate.minInstances.negative=Warm pool size cannot be negative.
XcpngTemplate.minInstances.exceedsMax=Warm pool size ({0}) exceeds the cloud''s Max instances ({1}); the warm pool is capped by Max instances.
XcpngTemplate.numCpus.label=The number of vCPUs
XcpngTemplate.memoryMb.label=The memory (MiB)
XcpngTemplate.field.notPositive={0} must be a positive whole number.
XcpngTemplate.field.notWhole={0} must be a whole number.
