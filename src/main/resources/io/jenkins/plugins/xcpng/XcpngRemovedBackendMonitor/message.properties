# Text for the XCP-ng removed-backend administrative monitor. A translation adds message_<lang>.properties
# beside this base bundle. Worded without apostrophes, so the question of whether a ${%...} lookup with no
# arguments goes through MessageFormat (and needs them doubled) never arises.
intro=This version of the XCP-ng cloud plugin speaks only the Xen Orchestra REST API. The XAPI backend has been removed.
clouds=These clouds are still configured for XAPI, either by name or because their credential is a username and password, which Xen Orchestra cannot use. They cannot provision anything. Open each one, point its URL at a Xen Orchestra appliance, select a secret-text credential holding a Xen Orchestra token, pin the certificate of the appliance if it is self-signed, and save.
agents=These agents were provisioned over XAPI, and this plugin can no longer destroy their VMs. Remove each agent, then reclaim its VM with tools/reaper.py, which finds it by the xcpng-cloud owner marker.
