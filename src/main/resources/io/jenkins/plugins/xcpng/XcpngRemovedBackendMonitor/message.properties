# Text for the XCP-ng removed-backend administrative monitor. A translation adds message_<lang>.properties
# beside this base bundle. Worded without apostrophes, so the question of whether a ${%...} lookup with no
# arguments goes through MessageFormat (and needs them doubled) never arises. The ones below that do take
# arguments go through MessageFormat, which is one more reason to keep apostrophes out.
intro=This version of the XCP-ng cloud plugin speaks only the Xen Orchestra REST API. The XAPI backend has been removed.
clouds=These clouds are still configured for XAPI, either by name or because their credential is a username and password, which Xen Orchestra cannot use. They cannot provision anything. Open each one, point its URL at a Xen Orchestra appliance, select a secret-text credential holding a Xen Orchestra token, pin the certificate of the appliance if it is self-signed, and save.
agents=These agents were provisioned over XAPI, and this plugin can no longer destroy their VMs. Remove each agent, then reclaim its VM with tools/reaper.py, which finds it by the xcpng-cloud owner marker.
leaked=These VMs were left on the pool by agents provisioned over XAPI, usually agents still running when the plugin was upgraded. Their teardown failed because this plugin can no longer reach them, and they may still be running. Nothing retries them. Reclaim them with the command under each cloud, run from a checkout of the plugin with the pool credentials described in its header: it finds each VM by the xcpng-cloud owner marker and is a dry run until you add --apply. Do not add --apply while agents of that cloud are up: it selects every VM of the cloud, not only these.
cloud=Cloud {0}:
leakedNamed={0} (VM {1})
leakedUnnamed=VM {0}, agent name not recorded
leakedPool=on {0}
forget=Forget
forgetHelp=Forget stops listing one entry and leaves its VM alone. Use it once the VM is gone from the pool.
