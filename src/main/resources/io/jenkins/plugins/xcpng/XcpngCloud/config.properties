removedBackend=This cloud is still configured for the XAPI backend, which this plugin no longer has, so it cannot provision anything. That is either because it names XAPI or because its credential is a username and password, which Xen Orchestra cannot use. Set the URL to a Xen Orchestra appliance, select a secret-text credential holding a Xen Orchestra token, pin the certificate of the appliance if it is self-signed, and save. Saving moves the cloud to Xen Orchestra.
