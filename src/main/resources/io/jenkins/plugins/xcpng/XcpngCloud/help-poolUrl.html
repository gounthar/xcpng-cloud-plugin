<div>
  Base URL of the XCP-ng pool master, for example <code>https://192.168.1.87</code>. The plugin speaks
  XAPI (JSON-RPC) to this address. Use an <code>https</code> URL; a plain <code>http</code> URL is
  rejected, because the XAPI session it carries includes the pool credential. Do not embed a username or
  password in the URL.
</div>
